name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile Python modules
        run: python -m compileall -q core ui main.py run_telegram_watcher.py run_youtube_uploader.py run_vk_uploader.py

      - name: Run isolated queue/numbering tests
        run: python -m pytest -q
